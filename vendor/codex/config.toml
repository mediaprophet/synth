# Local stdio template. Select a validated isolated binary before registration.
[mcp_servers.synth-local]
command = 'C:\github\synth\target-prod\debug\synth-mcp.exe'
args = ['mcp']
environment_id = 'local'
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 600

[mcp_servers.synth-local.env]
SYNTH_INPUT_ROOT = 'C:\github'
SYNTH_OUTPUT_ROOT = 'C:\github\synth\production'
