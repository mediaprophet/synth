# Project-scoped Grok config for Synth.
# Copy to C:\github\.grok\config.toml and C:\github\synth\.grok\config.toml
# Grok only reads [mcp_servers] / [plugins] / [permission] from project files.

[mcp_servers.synth]
command = "C:\\github\\synth\\target-gap-review\\debug\\synth.exe"
args = ["mcp"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 600

[mcp_servers.synth.env]
SYNTH_INPUT_ROOT = 'C:\github'
SYNTH_OUTPUT_ROOT = 'C:\github\synth\production'
