# Project-scoped Grok config for Synth.
# Copy to C:\github\.grok\config.toml and C:\github\synth\.grok\config.toml
# Grok only reads [mcp_servers] / [plugins] / [permission] from project files.
#
# Grok spawns a new stdio `synth mcp` child. Do not rebuild into
# C:\github\synth\target or target-studio (those binaries stay locked).
# Isolated produce/MCP binary is target-prod. Grok MCP uses synth-mcp.exe
# (paged catalog + synth_compile_q42) because Windows locks synth.exe while
# the previous stdio child is alive. Produce CLI can keep using synth.exe
# once that lock is gone and the sidecar is copied over.

[mcp_servers.synth]
command = "C:\\github\\synth\\target-prod\\debug\\synth-mcp.exe"
args = ["mcp"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 600

[mcp_servers.synth.env]
SYNTH_INPUT_ROOT = 'C:\github'
SYNTH_OUTPUT_ROOT = 'C:\github\synth\production'

[mcp_servers.colab-mcp]
command = "uvx"
args = ["git+https://github.com/googlecolab/colab-mcp"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 600
