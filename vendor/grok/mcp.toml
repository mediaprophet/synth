# Snippet for Grok project config. Merge into .grok/config.toml
# Tools appear as synth__<tool>, e.g. synth__synth_produce_present
#
# Isolated binary: target-prod (400 morphisms). Do not rebuild into
# target or target-studio. Grok MCP uses the sidecar synth-mcp.exe because
# Windows locks synth.exe while a previous stdio child is alive.

[mcp_servers.synth]
command = "C:\\github\\synth\\target-prod\\debug\\synth-mcp.exe"
args = ["mcp"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 600

[mcp_servers.synth.env]
SYNTH_INPUT_ROOT = 'C:\github'
SYNTH_OUTPUT_ROOT = 'C:\github\synth\production'
