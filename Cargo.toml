[package]
name = "synth"
version = "0.1.0"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license-file = "LICENSE"
description = "Webizen AI Synth — VibeScript asset production over QualiaDB"

[[bin]]
name = "synth"
path = "src/main.rs"

[[bin]]
name = "webizen-studio"
path = "src/bin/webizen_studio.rs"

[[bin]]
name = "synth-atlas"
path = "src/bin/synth_atlas.rs"
required-features = ["atlas"]

[dependencies]
qualia-core-db = { workspace = true }
webizen-render = { workspace = true, optional = true }
vibe = { workspace = true }
vibescript-abi = { workspace = true }
qualia-cooperative-core = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "565219caf91135188bebeb8965b4990879ae1d69" }
qualia-mcp = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "565219caf91135188bebeb8965b4990879ae1d69", default-features = false, features = ["authoring", "engine-tools"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
asset-production-vibe = { git = "https://github.com/mediaprophet/hypermedia-production.git", rev = "ae3880f2fd7ec7546811bafca35e6dc9c9ce5926" }
qualia-anatomy-pack = { path = "../qualiaDB/crates/qualia-anatomy-pack", optional = true }

aether-native = { git = "https://github.com/mediaprophet/Aether.git", rev = "a6b5fe1406e8d877b057a1cdf47d5c67b68dfa09", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "clipboard", "accessibility"], optional = true }
futures-timer = { version = "=3.0.4", optional = true }

# Linux native-ui uses pure aether-native (no Wry/WebKit2GTK). Windows/macOS keep the desktop tray.
[target.'cfg(not(target_os = "linux"))'.dependencies]
aether = { git = "https://github.com/mediaprophet/Aether.git", rev = "a6b5fe1406e8d877b057a1cdf47d5c67b68dfa09", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "third-party-renderer", "desktop"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
aether = { git = "https://github.com/mediaprophet/Aether.git", rev = "a6b5fe1406e8d877b057a1cdf47d5c67b68dfa09", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "native"], optional = true }

[build-dependencies]
winresource = "0.1"

[features]
default = ["preview", "cuda"]
preview = ["dep:webizen-render"]
cuda = ["qualia-core-db/cuda"]
native-ui = ["dep:aether", "dep:aether-native", "dep:futures-timer"]
atlas = ["dep:qualia-anatomy-pack"]
gpu-vbd-contact = ["asset-production-vibe/gpu-vbd-contact"]

[workspace]
resolver = "2"
members = ["."]
default-members = ["."]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
qualia-core-db = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "565219caf91135188bebeb8965b4990879ae1d69", default-features = false }
vibe = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "565219caf91135188bebeb8965b4990879ae1d69" }
vibescript-abi = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "565219caf91135188bebeb8965b4990879ae1d69" }
webizen-render = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "565219caf91135188bebeb8965b4990879ae1d69" }

[patch."https://github.com/mediaprophet/qualiaDB.git"]
qualia-core-db = { path = "../qualiaDB/crates/qualia-core-db" }
qualia-mcp = { path = "../qualiaDB/crates/qualia-mcp" }
qualia-cooperative-core = { path = "../qualiaDB/crates/qualia-cooperative-core" }
qualia-inference-kernel = { path = "../qualiaDB/crates/qualia-inference-kernel" }
qualia-sim = { path = "../qualiaDB/crates/qualia-sim" }
qualia-geospatial = { path = "../qualiaDB/crates/qualia-geospatial" }
qualia-vision = { path = "../qualiaDB/crates/qualia-vision" }
qualia-audio = { path = "../qualiaDB/crates/qualia-audio" }
vibe = { path = "../qualiaDB/crates/vibe" }
vibescript-abi = { path = "../qualiaDB/crates/vibescript-abi" }
webizen-render = { path = "../qualiaDB/crates/webizen-render" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../qualiaDB/crates/vibescript-abi" }

[patch."https://github.com/mediaprophet/hypermedia-production.git"]
asset-production-vibe = { path = "../hypermedia-production/crates/asset-production-vibe" }
pixel-buffer-output = { path = "../hypermedia-production/crates/pixel-buffer-output" }
pixel-window-render-adapter = { path = "../hypermedia-production/crates/pixel-window-render-adapter" }
vector-cpu-render-adapter = { path = "../hypermedia-production/crates/vector-cpu-render-adapter" }

# Aether a6b5fe1 native-dom uses extra Blitz event types (Resize, COUNT,
# BeforeInput, …) that crates.io blitz 0.3.0-beta.4 does not export.
# Aether's own [patch.crates-io] is ignored when Synth consumes Aether as a
# git crate; consumers must opt in at this workspace root. Release CI
# checkouts Aether next to synth. blitz-net is unused (aether-native `net`
# is off).
[patch.crates-io]
blitz-traits = { path = "../Aether/vendor/blitz/blitz-traits" }
blitz-dom = { path = "../Aether/vendor/blitz/blitz-dom" }

# Linux aether `native` enables aether-native/vello-hybrid, which type-checks
# etalon::Device against gpu-device-context's Device. Aether pins 575bab54;
# hypermedia 0.0.40.8.1 pins 8e8ab6c; sibling pixel-buffer-output pins
# a8f12b3f; QualiaDB pins d4a6af1. Aether's workspace patches are ignored
# for git consumers. Path-unify onto the sibling etalon tree (CI checkouts
# mediaprophet/etalon at 27a3f2a, branch 0.0.41.3).
[patch."https://github.com/mediaprophet/etalon.git"]
naga = { path = "../etalon/naga" }
naga-types = { path = "../etalon/naga-types" }
etalon = { path = "../etalon/etalon" }
etalon-hal = { path = "../etalon/etalon-hal" }
etalon-core = { path = "../etalon/etalon-core" }
etalon-types = { path = "../etalon/etalon-types" }
etalon-sync = { path = "../etalon/etalon-sync" }
etalon-naga-bridge = { path = "../etalon/etalon-naga-bridge" }
etalon-core-deps-apple = { path = "../etalon/etalon-core/platform-deps/apple" }
etalon-core-deps-emscripten = { path = "../etalon/etalon-core/platform-deps/emscripten" }
etalon-core-deps-linux-android-bsd = { path = "../etalon/etalon-core/platform-deps/linux-android-bsd" }
etalon-core-deps-wasm = { path = "../etalon/etalon-core/platform-deps/wasm" }
etalon-core-deps-windows = { path = "../etalon/etalon-core/platform-deps/windows" }
etalon-diagnostics = { path = "../etalon/crates/etalon-diagnostics" }
etalon-agent = { path = "../etalon/crates/etalon-agent" }
etalon-wgsl-forge = { path = "../etalon/crates/etalon-wgsl-forge" }
etalon-nquin = { path = "../etalon/crates/etalon-nquin" }
etalon-tensor = { path = "../etalon/crates/etalon-tensor" }
etalon-render = { path = "../etalon/crates/etalon-render" }
etalon-sim = { path = "../etalon/crates/etalon-sim" }
etalon-signal = { path = "../etalon/crates/etalon-signal" }
etalon-wasm = { path = "../etalon/crates/etalon-wasm" }
etalon-model = { path = "../etalon/crates/etalon-model" }
etalon-resources = { path = "../etalon/crates/etalon-resources" }
etalon-inference-kernel = { path = "../etalon/crates/etalon-inference-kernel" }
etalon-inference = { path = "../etalon/crates/etalon-inference" }
etalon-inference-contract = { path = "../etalon/crates/etalon-inference-contract" }
etalon-model-io = { path = "../etalon/crates/etalon-model-io" }
etalon-inference-lab = { path = "../etalon/crates/etalon-inference-lab" }
etalon-vibe = { path = "../etalon/crates/etalon-vibe" }
etalon-sense-core = { path = "../etalon/crates/etalon-sense-core" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = false
codegen-units = 16
opt-level = "s"
incremental = false

# Canonical Webizen Debian native Cargo profiles (PLAN-WEBIZEN-DEBIAN-NATIVE-PROFILES-2026-11-26).
[profile.webizen-host]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-desktop]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-subsystem]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-mobile]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-iot-headless]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[profile.webizen-iot-display]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

