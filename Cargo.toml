[package]
name = "synth"
version = "0.1.0"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license-file = "LICENSE"
description = "Webizen AI Synth — VibeScript asset production over QualiaDB"

[[bin]]
name = "synth"
path = "src/main.rs"

[[bin]]
name = "webizen-studio"
path = "src/bin/webizen_studio.rs"

[[bin]]
name = "synth-atlas"
path = "src/bin/synth_atlas.rs"
required-features = ["atlas"]

[dependencies]
qualia-core-db = { workspace = true }
webizen-render = { workspace = true, optional = true }
vibe = { workspace = true }
vibescript-abi = { workspace = true }
qualia-cooperative-core = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "cea504a9c326db24795c3aa8d4c540bdc7ec5209" }
qualia-mcp = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "cea504a9c326db24795c3aa8d4c540bdc7ec5209", default-features = false, features = ["authoring", "engine-tools"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
asset-production-vibe = { git = "https://github.com/mediaprophet/hypermedia-production.git", rev = "ae3880f2fd7ec7546811bafca35e6dc9c9ce5926" }
qualia-anatomy-pack = { path = "../qualiaDB/crates/qualia-anatomy-pack", optional = true }

aether-native = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "clipboard", "accessibility"], optional = true }
futures-timer = { version = "=3.0.4", optional = true }

# Linux native-ui uses pure aether-native (no Wry/WebKit2GTK). Windows/macOS keep the desktop tray.
[target.'cfg(not(target_os = "linux"))'.dependencies]
aether = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "third-party-renderer", "desktop"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
aether = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "native"], optional = true }

[build-dependencies]
winresource = "0.1"

[features]
default = ["preview", "cuda"]
preview = ["dep:webizen-render"]
cuda = ["qualia-core-db/cuda"]
native-ui = ["dep:aether", "dep:aether-native", "dep:futures-timer"]
atlas = ["dep:qualia-anatomy-pack"]
gpu-vbd-contact = ["asset-production-vibe/gpu-vbd-contact"]

[workspace]
resolver = "2"
members = ["."]
default-members = ["."]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
qualia-core-db = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "cea504a9c326db24795c3aa8d4c540bdc7ec5209", default-features = false }
vibe = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "cea504a9c326db24795c3aa8d4c540bdc7ec5209" }
vibescript-abi = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "cea504a9c326db24795c3aa8d4c540bdc7ec5209" }
webizen-render = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "cea504a9c326db24795c3aa8d4c540bdc7ec5209" }

[patch."https://github.com/mediaprophet/qualiaDB.git"]
qualia-core-db = { path = "../qualiaDB/crates/qualia-core-db" }
qualia-mcp = { path = "../qualiaDB/crates/qualia-mcp" }
qualia-cooperative-core = { path = "../qualiaDB/crates/qualia-cooperative-core" }
qualia-inference-kernel = { path = "../qualiaDB/crates/qualia-inference-kernel" }
qualia-sim = { path = "../qualiaDB/crates/qualia-sim" }
qualia-geospatial = { path = "../qualiaDB/crates/qualia-geospatial" }
qualia-vision = { path = "../qualiaDB/crates/qualia-vision" }
qualia-audio = { path = "../qualiaDB/crates/qualia-audio" }
vibe = { path = "../qualiaDB/crates/vibe" }
vibescript-abi = { path = "../qualiaDB/crates/vibescript-abi" }
webizen-render = { path = "../qualiaDB/crates/webizen-render" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../qualiaDB/crates/vibescript-abi" }

[patch."https://github.com/mediaprophet/hypermedia-production.git"]
asset-production-vibe = { path = "../hypermedia-production/crates/asset-production-vibe" }
pixel-buffer-output = { path = "../hypermedia-production/crates/pixel-buffer-output" }
pixel-window-render-adapter = { path = "../hypermedia-production/crates/pixel-window-render-adapter" }
vector-cpu-render-adapter = { path = "../hypermedia-production/crates/vector-cpu-render-adapter" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = false
codegen-units = 16
opt-level = "s"
incremental = false

# Canonical Webizen Debian native Cargo profiles (PLAN-WEBIZEN-DEBIAN-NATIVE-PROFILES-2026-11-26).
[profile.webizen-host]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-desktop]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-subsystem]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-mobile]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-iot-headless]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[profile.webizen-iot-display]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

