[package]
name = "synth"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "General-purpose VibeScript asset production over QualiaDB"

[[bin]]
name = "synth"
path = "src/main.rs"

[[bin]]
name = "synth-atlas"
path = "src/bin/synth_atlas.rs"
required-features = ["atlas"]

[dependencies]
qualia-core-db = { workspace = true }
webizen-render = { workspace = true, optional = true }
vibe = { workspace = true }
vibescript-abi = { workspace = true }
qualia-cooperative-core = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "86bf200126a3f2853c660d097026c55f7492e5da" }
qualia-mcp = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "86bf200126a3f2853c660d097026c55f7492e5da", default-features = false, features = ["authoring", "engine-tools"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
asset-production-vibe = { git = "https://github.com/mediaprophet/hypermedia-production.git", rev = "cb5c886bce991e7fc0d71460557919f5f9aef294" }
qualia-anatomy-pack = { path = "../qualiaDB/crates/qualia-anatomy-pack", optional = true }

aether = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["macro", "html", "signals", "hooks", "third-party-renderer"], optional = true }
aether-native = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "clipboard", "accessibility"], optional = true }
futures-timer = { version = "=3.0.4", optional = true }

[features]
default = []
preview = ["dep:webizen-render"]
native-ui = ["dep:aether", "dep:aether-native", "dep:futures-timer"]
atlas = ["dep:qualia-anatomy-pack"]

[workspace]
resolver = "2"
members = ["."]
default-members = ["."]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
qualia-core-db = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "86bf200126a3f2853c660d097026c55f7492e5da", default-features = false }
vibe = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "86bf200126a3f2853c660d097026c55f7492e5da" }
vibescript-abi = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "86bf200126a3f2853c660d097026c55f7492e5da" }
webizen-render = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "86bf200126a3f2853c660d097026c55f7492e5da" }

[patch."https://github.com/mediaprophet/qualiaDB.git"]
qualia-core-db = { path = "../qualiaDB/crates/qualia-core-db" }
qualia-mcp = { path = "../qualiaDB/crates/qualia-mcp" }
qualia-cooperative-core = { path = "../qualiaDB/crates/qualia-cooperative-core" }
qualia-inference-kernel = { path = "../qualiaDB/crates/qualia-inference-kernel" }
qualia-sim = { path = "../qualiaDB/crates/qualia-sim" }
qualia-geospatial = { path = "../qualiaDB/crates/qualia-geospatial" }
qualia-vision = { path = "../qualiaDB/crates/qualia-vision" }
qualia-audio = { path = "../qualiaDB/crates/qualia-audio" }
vibe = { path = "../qualiaDB/crates/vibe" }
vibescript-abi = { path = "../qualiaDB/crates/vibescript-abi" }
webizen-render = { path = "../qualiaDB/crates/webizen-render" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../qualiaDB/crates/vibescript-abi" }

[patch."https://github.com/mediaprophet/hypermedia-production.git"]
asset-production-vibe = { path = "../hypermedia-production/crates/asset-production-vibe" }
pixel-buffer-output = { path = "../hypermedia-production/crates/pixel-buffer-output" }
pixel-window-render-adapter = { path = "../hypermedia-production/crates/pixel-window-render-adapter" }
vector-cpu-render-adapter = { path = "../hypermedia-production/crates/vector-cpu-render-adapter" }

[patch."https://github.com/mediaprophet/etalon.git"]
naga = { path = "../etalon/naga" }
etalon = { path = "../etalon/etalon" }
etalon-diagnostics = { path = "../etalon/crates/etalon-diagnostics" }
etalon-agent = { path = "../etalon/crates/etalon-agent" }
etalon-wgsl-forge = { path = "../etalon/crates/etalon-wgsl-forge" }
etalon-nquin = { path = "../etalon/crates/etalon-nquin" }
etalon-tensor = { path = "../etalon/crates/etalon-tensor" }
etalon-render = { path = "../etalon/crates/etalon-render" }
etalon-sim = { path = "../etalon/crates/etalon-sim" }
etalon-signal = { path = "../etalon/crates/etalon-signal" }
etalon-wasm = { path = "../etalon/crates/etalon-wasm" }
etalon-model = { path = "../etalon/crates/etalon-model" }
etalon-resources = { path = "../etalon/crates/etalon-resources" }
etalon-inference-kernel = { path = "../etalon/crates/etalon-inference-kernel" }
etalon-inference = { path = "../etalon/crates/etalon-inference" }
etalon-inference-contract = { path = "../etalon/crates/etalon-inference-contract" }
etalon-model-io = { path = "../etalon/crates/etalon-model-io" }
etalon-inference-lab = { path = "../etalon/crates/etalon-inference-lab" }
etalon-vibe = { path = "../etalon/crates/etalon-vibe" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = false
codegen-units = 16
opt-level = "s"
incremental = false
