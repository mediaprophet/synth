[package]
name = "synth"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "General-purpose VibeScript asset production over QualiaDB"

[[bin]]
name = "synth"
path = "src/main.rs"

[dependencies]
qualia-core-db = { workspace = true }
webizen-render = { workspace = true, optional = true }
vibe = { workspace = true }
vibescript-abi = { workspace = true }
qualia-cooperative-core = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0" }
qualia-mcp = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0", default-features = false, features = ["authoring"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
asset-production-vibe = { git = "https://github.com/mediaprophet/hypermedia-production.git", rev = "af57e82120b30b47fca238edb21a839d2cdb4278" }

aether = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["macro", "html", "signals", "hooks", "third-party-renderer"], optional = true }
aether-native = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "clipboard", "accessibility"], optional = true }
futures-timer = { version = "=3.0.4", optional = true }

[features]
default = []
preview = ["dep:webizen-render"]
native-ui = ["dep:aether", "dep:aether-native", "dep:futures-timer"]

[workspace]
resolver = "2"
members = ["."]
default-members = ["."]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
qualia-core-db = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0", default-features = false }
vibe = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0" }
vibescript-abi = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0" }
webizen-render = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0" }

[patch."https://github.com/mediaprophet/qualiaDB.git"]
qualia-core-db = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "e2084243a5bc68d08e48d511c24c105b3b0d24b0" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = false
codegen-units = 16
opt-level = "s"
incremental = false
