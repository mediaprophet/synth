[workspace]
members = [
    "native",
    "wasm",
    "crates/geometry",
    "crates/spatial-authoring",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ciborium = "0.2.2"
uuid = { version = "1.24", features = ["v4", "js"] }
chrono = { version = "0.4.45", default-features = false }
console_error_panic_hook = "0.1.7"
base64 = { version = "0.22.1", default-features = false }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
vibe = { path = "../qualiaDB/crates/vibe" }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

[patch.crates-io]
cpal = { path = "../hypermedia-libraries/crates/audio-device-cpal" }
wgpu = { git = "https://github.com/mediaprophet/etalon.git", rev = "072b4d9ceeebd423234359dff1dee8fbe9e62b6e" }
naga = { git = "https://github.com/mediaprophet/etalon.git", rev = "072b4d9ceeebd423234359dff1dee8fbe9e62b6e" }
