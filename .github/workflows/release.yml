name: Synth Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to, for example v0.0.41.3"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Synth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: synth-windows-x86_64.exe
          - os: macos-15
            artifact: synth-macos-aarch64
          - os: ubuntu-22.04
            artifact: synth-linux-x86_64

    steps:
      - name: Require updater seed
        shell: bash
        env:
          SYNTH_UPDATE_SEED: ${{ secrets.SYNTH_UPDATE_SEED }}
        run: |
          if [ -z "$SYNTH_UPDATE_SEED" ]; then
            echo "Add repository secret SYNTH_UPDATE_SEED (64 hex chars from synth/.synth/update-seed.hex)." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          path: synth

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/qualiaDB
          ref: 0.0.41.3
          path: qualiaDB

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/hypermedia-production
          ref: 0.0.41.3
          path: hypermedia-production

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            synth/target
          key: ${{ runner.os }}-cargo-synth-${{ hashFiles('synth/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-synth-

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev

      - name: Build synth
        working-directory: synth
        run: cargo build --release --features preview,native-ui --bin synth

      - name: Sign artifact
        working-directory: synth
        shell: bash
        env:
          SYNTH_UPDATE_SEED: ${{ secrets.SYNTH_UPDATE_SEED }}
        run: |
          mkdir -p dist
          if [ -f target/release/synth.exe ]; then
            BIN=target/release/synth.exe
          else
            BIN=target/release/synth
          fi
          cp "$BIN" "dist/${{ matrix.artifact }}"
          "$BIN" update sign --artifact "dist/${{ matrix.artifact }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Synth ${{ env.RELEASE_TAG }}
          body: |
            Signed Synth CLI + Aether operator tray (Windows, macOS, Linux).

            Download the binary for your OS, then:

            ```
            synth update verify --artifact <downloaded-file>
            synth update apply --artifact <downloaded-file>
            ```

            Apply copies next to the running binary and never overwrites a locked `synth.exe`.
            First install: download, mark executable on macOS/Linux, run `synth operator` or `synth serve`.
          files: |
            synth/dist/${{ matrix.artifact }}
            synth/dist/${{ matrix.artifact }}.sig
            synth/dist/${{ matrix.artifact }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
