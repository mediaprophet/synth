name: Synth Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to, for example v0.0.41.3"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Synth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: synth-windows-x86_64.exe
            pack_os: windows
          - os: macos-15
            artifact: synth-macos-aarch64
            pack_os: macos
          - os: ubuntu-22.04
            artifact: synth-linux-x86_64
            pack_os: linux

    env:
      SYNTH_UPDATE_SEED: ${{ secrets.SYNTH_UPDATE_SEED || vars.SYNTH_UPDATE_SEED }}
    steps:
      - name: Require updater seed
        shell: bash
        run: |
          echo "secrets.SYNTH_UPDATE_SEED=${{ secrets.SYNTH_UPDATE_SEED != '' }}"
          echo "vars.SYNTH_UPDATE_SEED=${{ vars.SYNTH_UPDATE_SEED != '' }}"
          echo "seed_len=${#SYNTH_UPDATE_SEED}"
          if [ -z "$SYNTH_UPDATE_SEED" ]; then
            echo "GitHub did not pass SYNTH_UPDATE_SEED. Put 64 hex chars in Settings → Secrets and variables → Actions as secret or variable SYNTH_UPDATE_SEED. Dependabot and Codespaces secrets are not injected here." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          path: synth

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/qualiaDB
          ref: 0.0.41.3
          path: qualiaDB

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/anvil
          ref: main
          path: anvil

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/hypermedia-production
          ref: 0.0.41.3
          path: hypermedia-production

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            synth/target
          key: ${{ runner.os }}-cargo-synth-${{ hashFiles('synth/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-synth-

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev

      - name: Build synth
        working-directory: synth
        run: cargo build --release --features preview,native-ui --bin synth

      - name: Sign artifact
        working-directory: synth
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/synth.exe ]; then
            BIN=target/release/synth.exe
          else
            BIN=target/release/synth
          fi
          cp "$BIN" "dist/${{ matrix.artifact }}"
          "$BIN" update sign --artifact "dist/${{ matrix.artifact }}"

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: choco install nsis --no-progress -y

      - name: Package installer
        working-directory: synth
        shell: bash
        run: |
          installer=$(bash packaging/ci-package.sh "${{ matrix.pack_os }}" "${{ env.RELEASE_TAG }}" "${{ matrix.artifact }}" | tail -n 1 | tr -d '\r')
          test -n "$installer"
          test -f "dist/$installer"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          if [ -f target/release/synth.exe ]; then
            BIN=target/release/synth.exe
          else
            BIN=target/release/synth
          fi
          "$BIN" update sign --artifact "dist/$installer"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Webizen AI Synth ${{ env.RELEASE_TAG }}
          body: |
            Webizen AI Synth — signed installer plus portable CLI (Windows, macOS, Linux).

            Prefer the installer for first install:

            - Windows: `WebizenAI-Synth-Setup-windows-x86_64.exe`
            - macOS: `WebizenAI-Synth-macos-aarch64.dmg`
            - Linux: `webizen-ai-synth_*_amd64.deb`

            Portable binaries stay available for `synth update verify` / `apply`.
            Apply copies next to the running binary and never overwrites a locked `synth.exe`.
          files: |
            synth/dist/${{ matrix.artifact }}
            synth/dist/${{ matrix.artifact }}.sig
            synth/dist/${{ matrix.artifact }}.sha256
            synth/dist/${{ env.INSTALLER }}
            synth/dist/${{ env.INSTALLER }}.sig
            synth/dist/${{ env.INSTALLER }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
