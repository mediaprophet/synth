name: Synth Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to, for example v0.0.41.3"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Synth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: synth-windows-x86_64.exe
            pack_os: windows
          - os: macos-15
            artifact: synth-macos-aarch64
            pack_os: macos

    env:
      SYNTH_UPDATE_SEED: ${{ secrets.SYNTH_UPDATE_SEED || vars.SYNTH_UPDATE_SEED }}
    steps:
      - name: Require updater seed
        shell: bash
        run: |
          echo "secrets.SYNTH_UPDATE_SEED=${{ secrets.SYNTH_UPDATE_SEED != '' }}"
          echo "vars.SYNTH_UPDATE_SEED=${{ vars.SYNTH_UPDATE_SEED != '' }}"
          echo "seed_len=${#SYNTH_UPDATE_SEED}"
          if [ -z "$SYNTH_UPDATE_SEED" ]; then
            echo "GitHub did not pass SYNTH_UPDATE_SEED. Put 64 hex chars in Settings → Secrets and variables → Actions as secret or variable SYNTH_UPDATE_SEED. Dependabot and Codespaces secrets are not injected here." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          path: synth

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/qualiaDB
          ref: 0.0.41.3
          path: qualiaDB

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/anvil
          ref: main
          path: anvil

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/hypermedia-production
          ref: 0.0.41.3
          path: hypermedia-production

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/Aether
          ref: a6b5fe1406e8d877b057a1cdf47d5c67b68dfa09
          path: Aether

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/etalon
          ref: 27a3f2a68a847bc4c3dcb811a19019ba361920bf
          path: etalon

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            synth/target
          key: ${{ runner.os }}-cargo-synth-${{ hashFiles('synth/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-synth-

      - name: Build synth
        working-directory: synth
        run: cargo build --release --features preview,native-ui --bin synth

      - name: Sign artifact
        working-directory: synth
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/synth.exe ]; then
            BIN=target/release/synth.exe
          else
            BIN=target/release/synth
          fi
          cp "$BIN" "dist/${{ matrix.artifact }}"
          "$BIN" update sign --artifact "dist/${{ matrix.artifact }}"

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: choco install nsis --no-progress -y

      - name: Package installer
        working-directory: synth
        shell: bash
        run: |
          installer=$(bash packaging/ci-package.sh "${{ matrix.pack_os }}" "${{ env.RELEASE_TAG }}" "${{ matrix.artifact }}" | tail -n 1 | tr -d '\r')
          test -n "$installer"
          test -f "dist/$installer"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          if [ -f target/release/synth.exe ]; then
            BIN=target/release/synth.exe
          else
            BIN=target/release/synth
          fi
          "$BIN" update sign --artifact "dist/$installer"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Webizen AI Synth ${{ env.RELEASE_TAG }}
          body: |
            Webizen AI Synth — signed installer plus portable CLI (Windows, macOS, Linux).

            Prefer the installer for first install:

            - Windows: `WebizenAI-Synth-Setup-windows-x86_64.exe`
            - macOS: `WebizenAI-Synth-macos-aarch64.dmg`
            - Linux: `webizen-ai-synth_*_amd64.deb` / `webizen-ai-synth_*_arm64.deb`

            Portable binaries stay available for `synth update verify` / `apply`.
            Apply copies next to the running binary and never overwrites a locked `synth.exe`.
          files: |
            synth/dist/${{ matrix.artifact }}
            synth/dist/${{ matrix.artifact }}.sig
            synth/dist/${{ matrix.artifact }}.sha256
            synth/dist/${{ env.INSTALLER }}
            synth/dist/${{ env.INSTALLER }}.sig
            synth/dist/${{ env.INSTALLER }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-debian:
    name: Synth Debian bookworm (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            artifact: synth-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            artifact: synth-linux-aarch64
    env:
      SYNTH_UPDATE_SEED: ${{ secrets.SYNTH_UPDATE_SEED || vars.SYNTH_UPDATE_SEED }}
    steps:
      - name: Install Debian bookworm native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libssl-dev libvulkan-dev libwayland-dev libx11-dev \
            libxkbcommon-dev libfontconfig1-dev libasound2-dev \
            binutils file dpkg-dev
          if dpkg -l | grep -Eqi 'libwebkit2gtk|libjavascriptcoregtk'; then
            echo "WebKit2GTK / JavaScriptCore must not be installed for native Debian synth" >&2
            exit 1
          fi

      - name: Require updater seed
        shell: bash
        run: |
          if [ -z "$SYNTH_UPDATE_SEED" ]; then
            echo "GitHub did not pass SYNTH_UPDATE_SEED." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          path: synth

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/qualiaDB
          ref: 0.0.41.3
          path: qualiaDB

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/anvil
          ref: main
          path: anvil

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/hypermedia-production
          ref: 0.0.41.3
          path: hypermedia-production

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/qap-compiler
          path: qap-compiler

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/Aether
          ref: a6b5fe1406e8d877b057a1cdf47d5c67b68dfa09
          path: Aether

      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/etalon
          ref: 27a3f2a68a847bc4c3dcb811a19019ba361920bf
          path: etalon

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add ${{ matrix.rust_target }}

      - name: Build synth (aether-native, isolated target dir)
        working-directory: synth
        run: |
          cargo build --profile webizen-desktop --no-default-features \
            --features preview,native-ui --bin synth \
            --target ${{ matrix.rust_target }} \
            --target-dir target-debian-profiles

      - name: Verify Debian glibc 2.36 baseline and no WebKit2GTK
        run: |
          BIN="synth/target-debian-profiles/${{ matrix.rust_target }}/webizen-desktop/synth"
          if [ ! -x "$BIN" ]; then
            BIN="synth/target-debian-profiles/webizen-desktop/synth"
          fi
          bash qap-compiler/packaging/debian/verify-debian-binary.sh --profile webizen-desktop --bin "$BIN"

      - name: Sign artifact
        working-directory: synth
        shell: bash
        run: |
          mkdir -p dist
          BIN="target-debian-profiles/${{ matrix.rust_target }}/webizen-desktop/synth"
          if [ ! -x "$BIN" ]; then
            BIN="target-debian-profiles/webizen-desktop/synth"
          fi
          cp "$BIN" "dist/${{ matrix.artifact }}"
          "$BIN" update sign --artifact "dist/${{ matrix.artifact }}"

      - name: Package Debian installer
        working-directory: synth
        shell: bash
        run: |
          installer=$(bash packaging/ci-package.sh linux "${{ env.RELEASE_TAG }}" "${{ matrix.artifact }}" "${{ matrix.arch }}" | tail -n 1 | tr -d '\r')
          test -n "$installer"
          test -f "dist/$installer"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          BIN="target-debian-profiles/${{ matrix.rust_target }}/webizen-desktop/synth"
          if [ ! -x "$BIN" ]; then
            BIN="target-debian-profiles/webizen-desktop/synth"
          fi
          "$BIN" update sign --artifact "dist/$installer"

      - name: Upload Debian assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            synth/dist/${{ matrix.artifact }}
            synth/dist/${{ matrix.artifact }}.sig
            synth/dist/${{ matrix.artifact }}.sha256
            synth/dist/${{ env.INSTALLER }}
            synth/dist/${{ env.INSTALLER }}.sig
            synth/dist/${{ env.INSTALLER }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

